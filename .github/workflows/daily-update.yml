name: daily-update

on:
  push:
    branches: [main]
    paths:
      - 'workspace/data/宽基得分.csv'
  schedule:
    # 每天 08:00 北京时间（UTC 前一天 00:00）
    # 注意：GitHub 定时任务排队可能延迟几分钟到十几分钟，属正常现象
    - cron: '0 0 * * *'
  workflow_dispatch:

# 结果需要提交回 main，并发布 GitHub Pages
permissions:
  contents: write

# 同一时间只允许一个日更任务，避免并发提交冲突
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install Python dependencies
        run: pip install -r requirements.lock.txt

      # runtime 里有两处字体配置：baseline_score_strategy.py 用 ["Microsoft YaHei", "SimHei", "Noto Sans SC"]，
      # plotting.py 只用 ["SimHei"]。Ubuntu 上这些字体都没有。
      # 这里安装 Noto Sans SC，并用 fonttools 复制一份把字族名改成 SimHei
      # （Noto 是 OFL 协议，允许改名后再分发），否则 PNG 图表里的中文全是方块。
      - name: Install Chinese fonts for matplotlib
        run: |
          set -e
          pip install fonttools
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL -o "$HOME/.local/share/fonts/NotoSansSC-Regular.otf" \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          python - <<'EOF'
          import os
          from fontTools.ttLib import TTFont
          src = os.path.expanduser("~/.local/share/fonts/NotoSansSC-Regular.otf")
          dst = os.path.expanduser("~/.local/share/fonts/SimHei.otf")
          font = TTFont(src)
          for rec in font["name"].names:
              if rec.nameID in (1, 3, 4, 6, 16):
                  rec.string = "SimHei".encode(rec.getEncoding())
          font.save(dst)
          print("SimHei alias font written:", dst)
          EOF
          fc-cache -f
          rm -rf "$HOME/.cache/matplotlib"
          fc-list | grep -iE "noto sans sc|simhei" || true

      # 仓库提交的 workspace/runs/default 缺少两个关键中间表
      # （selected_rule_daily_positions 和 composite_strategy_daily，作者本地生成后从未提交），
      # update 的历史前缀校验解析不到它们会直接报错退出。
      # 首次运行时用 selected-rules 子命令从已提交的数据确定性补算一次；
      # 补算后文件即存在，后续运行自动跳过本步骤。
      - name: Bootstrap missing artifacts (first run only)
        run: |
          if [ ! -f "workspace/runs/default/results/selected_single_factor_rules/selected_rule_daily_positions.parquet" ] \
          && [ ! -f "workspace/runs/default/results/selected_single_factor_rules/selected_rule_daily_positions.csv" ]; then
            echo "首次运行：补算 selected_rule_daily_positions / composite_strategy_daily"
            python scripts/run_pipeline.py selected-rules --input-dir workspace/runs/default
          else
            echo "关键表已存在，跳过补算"
          fi

      # 本仓库是 YuanZhaohan/factor-timing-advisor 的 fork，dududu 每天把最新 CSV
      # 传到上游仓库。定时/手动运行时先从上游拉最新 CSV 再跑；失败则退回用本仓库已提交的 CSV。
      # push 触发说明 CSV 是直接推到本仓库的，跳过同步。
      - name: Sync input CSV from upstream
        if: github.event_name != 'push'
        run: |
          URL="https://raw.githubusercontent.com/YuanZhaohan/factor-timing-advisor/main/workspace/data/%E5%AE%BD%E5%9F%BA%E5%BE%97%E5%88%86.csv"
          curl -fsSL -o "workspace/data/宽基得分.csv" "$URL" \
            || echo "::warning::上游 CSV 拉取失败，使用本仓库已提交的 CSV"
          ls -la workspace/data/

      - name: Run daily update
        run: python scripts/run_pipeline.py update

      # CSV 没有新交易日时 update 正常返回（no_new_rows），只有审计文件变动；
      # 没有变化时跳过提交。
      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/runs/default "workspace/data/宽基得分.csv"
          if git diff --cached --quiet; then
            echo "结果无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: daily timing update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main

      - name: Show latest advisor summary
        if: success() || failure()
        run: head -n 50 workspace/runs/default/results/report/advisor_summary.md || true

      - name: Prepare report site
        if: success()
        run: |
          mkdir -p _site
          cp workspace/runs/default/results/report/timing_report.html _site/index.html

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    if: success()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
